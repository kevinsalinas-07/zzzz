services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: origenes
      POSTGRES_USER: origenes
      POSTGRES_PASSWORD: origenes
    ports:
      - "5433:5432"
    volumes:
      - origenes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origenes -d origenes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  origenes-data:
